name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical typecheck
        run: pnpm run typecheck
      - name: Explicit production package typechecks
        run: |
          pnpm --filter @workspace/frontend run typecheck
          pnpm --filter @workspace/admin-ui run typecheck
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/admin-server run typecheck
          pnpm --filter @workspace/scripts run typecheck
      - name: Canonical build
        run: pnpm run build
      - name: Package tests
        run: pnpm --filter @workspace/admin-server run test

  images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          tags: workspace-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/Admin-p/admin-server/Dockerfile
          tags: workspace-admin:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: workspace-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan admin image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: workspace-admin:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Start API container
        run: >-
          docker run -d --name workspace-api --network host
          -e PORT=18080 -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/app_test
          -e CONFIG_ENCRYPTION_KEY=ci-encryption-key-at-least-32-characters
          workspace-api:${{ github.sha }}
      - name: Start admin container
        run: >-
          docker run -d --name workspace-admin --network host
          -e PORT=18099 -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/app_test
          -e CONFIG_ENCRYPTION_KEY=ci-encryption-key-at-least-32-characters
          -e ADMIN_ROUTE_PREFIX=admin -e ADMIN_BOOTSTRAP_TOKEN=ci-bootstrap-token
          -e ADMIN_BOOTSTRAP_TOKEN_EXPIRES_AT=2099-01-01T00:00:00Z
          workspace-admin:${{ github.sha }}
      - name: Container readiness smoke test
        run: |
          for url in http://127.0.0.1:18080/api/readyz http://127.0.0.1:18099/api/readyz; do
            for attempt in $(seq 1 60); do
              status=$(curl --silent --output /tmp/readiness.json --write-out '%{http_code}' "$url" || true)
              if [ "$status" = 200 ]; then break; fi
              if [ "$attempt" = 60 ]; then docker logs workspace-api; docker logs workspace-admin; exit 1; fi
              sleep 2
            done
          done
      - if: always()
        run: docker rm -f workspace-api workspace-admin 2>/dev/null || true
